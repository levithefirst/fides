# Fides: agreement notice windows and threatened-milestone escalation.
# Module keys and fields verified against live Forge docs; see docs/SDK-NOTES.md.
modules:
  jira:globalPage:
    - key: fides-board
      resource: board
      resolver:
        function: resolver
      render: native
      title: Fides
      layout: native

  jira:issuePanel:
    - key: fides-issue-panel
      resource: panel
      resolver:
        function: resolver
      render: native
      title: Fides notice status
      icon: resource:static;icons/fides.svg

  scheduledTrigger:
    - key: fides-daily-scan
      function: daily-scan
      interval: day

  trigger:
    - key: fides-on-install
      function: on-install
      events:
        - avi:forge:installed:app

  rovo:agent:
    - key: fides-agent
      name: Fides
      description: Tracks vendor agreement notice windows, opens review issues, escalates threatened milestones and drafts hedged renew, cancel or renegotiate briefs.
      icon: resource:static;icons/fides.svg
      prompt: resource:static;agent/prompt.txt
      conversationStarters:
        - Is Helios at risk, and what should I do?
        - What notices are due in the next 60 days?
        - Escalate threatened milestones
        - Create a review issue for the most urgent agreement
        - Draft a renew or cancel brief for Helios Payroll
        - Track this contract from its Confluence page
      actions:
        - list-upcoming-notices
        - create-review-issue
        - escalate-threatened-milestones
        - draft-brief
        - check-agreement-from-page
        - track-agreement-from-page

  action:
    - key: list-upcoming-notices
      name: List upcoming notices
      function: action-list
      actionVerb: GET
      description: |
        List vendor agreements whose notice-by date is Due (within 14 days or already past) or falls within the next N days (default 60). Returns status, notice-by date, days left, owner, contract page and whether a threatened milestone was escalated.
      inputs:
        days:
          title: Lookahead in days
          type: integer
          required: false
          description: How many days ahead to look. Defaults to 60.

    - key: create-review-issue
      name: Create or reuse review issue
      function: action-review
      actionVerb: CREATE
      description: |
        Create a Jira review issue for one agreement, or return the existing open one, linked to the agreement issue. Never duplicates. Use when the user wants to start a renew, cancel or renegotiate decision.
      inputs:
        agreement:
          title: Agreement
          type: string
          required: true
          description: The vendor name exactly as the user said it (for example Northwind Analytics). Use an issue key only if the user typed one. Never guess a key.

    - key: escalate-threatened-milestones
      name: Escalate threatened milestones (create or reuse)
      function: action-escalate
      actionVerb: CREATE
      description: |
        For agreements whose notice-by or milestone date is within 14 days or past, create or reuse exactly one escalation issue per open linked blocker (a question, approval or unmet deliverable). Never duplicates. Optionally limited to one agreement.
      inputs:
        agreement:
          title: Agreement
          type: string
          required: false
          description: The vendor name as the user said it, or an issue key only if the user typed one. To scan every agreement, pass "all agreements" (or "all"). An empty value means the same thing.

    - key: draft-brief
      name: Draft renew or cancel brief
      function: action-brief
      actionVerb: GET
      description: |
        Gather what is needed for a hedged renew, cancel or renegotiate brief for one agreement: dates, obligations, open blockers, what a missed notice could mean, and relevant excerpts from the linked Confluence contract page read as the current user.
      inputs:
        agreement:
          title: Agreement
          type: string
          required: true
          description: The vendor name as the user said it (for example Helios Payroll), or a key or Confluence page URL only if the user typed one. Never guess a key.
        readPage:
          title: Read the contract page
          type: boolean
          required: false
          description: Set to false to skip reading the linked Confluence page. Defaults to true.

    - key: check-agreement-from-page
      name: Check contract page
      function: action-check
      actionVerb: GET
      description: |
        Read-only. Read a Confluence contract page as the user and say whether it is already tracked in Jira (existing agreement key) or propose a new agreement with quoted sources. Creates nothing. Use first for "track this contract".
      inputs:
        page:
          title: Confluence page
          type: string
          required: true
          description: The Confluence page URL, page id or exact page title. Use "this page" when Rovo is open on the contract page.

    - key: track-agreement-from-page
      name: Track agreement from page
      function: action-track
      actionVerb: CREATE
      description: |
        Write step. Call only after the user confirmed a proposal from check-agreement-from-page (confirm true). Creates the agreement once per page, or on an already tracked sample page updates its dates to match Jira.
      inputs:
        page:
          title: Confluence page
          type: string
          required: true
          description: The Confluence page URL, page id or exact page title. Use "this page" when Rovo is open on the contract page.
        confirm:
          title: Confirmed by the user
          type: boolean
          required: false
          description: Set to true only after the user has confirmed the proposal. Defaults to false (proposal only, nothing created).
        vendor:
          title: Vendor
          type: string
          required: false
          description: Vendor name, if the user supplied or corrected it.
        endDate:
          title: End date
          type: string
          required: false
          description: End date as YYYY-MM-DD, if the user supplied or corrected it.
        noticeDays:
          title: Notice period in days
          type: integer
          required: false
          description: Notice period in days, if the user supplied or corrected it.
        owner:
          title: Owner
          type: string
          required: false
          description: Agreement owner name or email, if the user supplied or corrected it.

  function:
    - key: resolver
      handler: index.handler
    - key: daily-scan
      handler: index.dailyScan
      timeoutSeconds: 300
    - key: on-install
      handler: index.installed
    - key: action-list
      handler: index.listUpcomingNotices
    - key: action-review
      handler: index.createReviewIssueAction
    - key: action-escalate
      handler: index.escalateThreatenedMilestones
    - key: action-brief
      handler: index.draftBriefAction
    - key: action-check
      handler: index.checkAgreementFromPageAction
    - key: action-track
      handler: index.trackAgreementFromPageAction

resources:
  - key: board
    path: src/frontend/board.jsx
  - key: panel
    path: src/frontend/panel.jsx
  - key: static
    path: static

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
    - read:page:confluence
    - write:page:confluence
    - read:space:confluence

app:
  id: ari:cloud:ecosystem::app/8014edf9-7ace-467e-9b4b-6ae6d9328c9f
  runtime:
    name: nodejs24.x
